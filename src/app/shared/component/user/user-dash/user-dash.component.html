<div class="row">
    <div class="col-12">
        <button routerLink="add" class="btn btn-outline-primary mb-3">Add User</button>
    </div>
    <div class="col-md-4">
        <ul class="list-group">
            <li *ngFor="let user of userArray"

            {{user.userName}} 
            

            </li>
        </ul>
    </div>
</div>
