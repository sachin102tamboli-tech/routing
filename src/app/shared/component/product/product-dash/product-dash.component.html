
<div class="row">
    <div class="col-12 mb-3 text-right" >
        <button class="btn btn-sm btn-outline-primary"
        routerLink="add">Add Product</button>
    </div>
    <div class="col-md-4">
        <ul class="list-group">
            <li *ngFor="let prod of productArray"
            class="list-group-item"
            [routerLink]="prod.pid">
                <strong>
                    {{prod.pname}}
                </strong>
                {{prod.pid}}
            </li>
        </ul>
    </div>
    <div class="col-md-8">
        
    </div>
</div>
